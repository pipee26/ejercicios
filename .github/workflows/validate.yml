name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install validator (pinned major version)
        run: npm i ajv@^8
      - name: Validate exercises.json against the schema
        run: node scripts/validate-schema.mjs
